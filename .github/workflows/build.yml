name: APK Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: İmza anahtarını hazırla
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 yok, debug anahtarıyla imzalanacak"
          fi

      - name: APK derle
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Anahtar yalnızca repo GİZLİ ise APK'ya gömülür; herkese açık repoda asla eklenmez
          GEMINI_API_KEY: ${{ github.event.repository.private && secrets.GEMINI_API_KEY || '' }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk Eclyra-Asistan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Eclyra-Asistan
          path: Eclyra-Asistan.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Eclyra Asistan 1.0.${{ github.run_number }}
          make_latest: true
          files: Eclyra-Asistan.apk
          body: |
            **Eclyra** — Türkçe sesli yapay zekâ asistanı.

            Kurulum: `Eclyra-Asistan.apk` dosyasını telefona indir ve aç. "Bilinmeyen kaynaklardan yükleme" izni isterse ver.
